name: DevonCraft calculator build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out DevonCraft
        uses: actions/checkout@v4

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ zlib1g-dev

      - name: Run host-side unit tests
        run: make -C tests test

  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out DevonCraft
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: devoncraft

      - name: Check out Ndless SDK
        uses: actions/checkout@v4
        with:
          repository: ndless-nspire/Ndless
          ref: r2020
          submodules: recursive
          fetch-depth: 0
          path: ndless

      - name: Install toolchain build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev libboost-program-options-dev

      # The Ndless build script uses both the installed toolchain and its
      # .built_* marker files to decide which compiler stages can be skipped.
      # Cache both so a cache hit avoids the multi-stage GCC/binutils rebuild.
      - name: Restore Ndless toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ndless/ndless-sdk/toolchain/install
            ndless/ndless-sdk/toolchain/.built_binutils
            ndless/ndless-sdk/toolchain/.built_gcc_step1
            ndless/ndless-sdk/toolchain/.built_newlib
            ndless/ndless-sdk/toolchain/.built_gcc_step2
            ndless/ndless-sdk/toolchain/.built_gdb
          key: ndless-toolchain-${{ runner.os }}-r2020-${{ hashFiles('ndless/ndless-sdk/toolchain/build_toolchain.sh') }}

      - name: Build Ndless toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: ndless/ndless-sdk/toolchain
        run: PARALLEL="-j$(nproc)" ./build_toolchain.sh

      - name: Add Ndless tools to PATH
        run: |
          echo "$GITHUB_WORKSPACE/ndless/ndless-sdk/toolchain/install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ndless/ndless-sdk/bin" >> "$GITHUB_PATH"

      - name: Build Ndless SDK
        working-directory: ndless
        run: make -j"$(nproc)"

      - name: Build DevonCraft release
        working-directory: devoncraft
        run: make -j"$(nproc)"

      - name: Build DevonCraft stress-test variant
        working-directory: devoncraft
        run: |
          make clean-objs
          make STRESS=1 -j"$(nproc)"

      - name: Upload calculator executables
        uses: actions/upload-artifact@v4
        with:
          name: devoncraft-calculator
          path: |
            devoncraft/devoncraft.tns
            devoncraft/devoncraft-stress.tns
          if-no-files-found: error
