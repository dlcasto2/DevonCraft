name: Calculator build

on:
  push:
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/Makefile'
      - '.github/workflows/calc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: crafti

      - uses: actions/checkout@v4
        with:
          repository: ndless-nspire/Ndless
          ref: r2020
          submodules: recursive
          fetch-depth: 1          # full history not needed for a pinned ref
          path: ndless

      - run: sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev libboost-program-options-dev zlib1g-dev
        # python3-dev intentionally omitted — we skip GDB python support below

      - uses: actions/cache@v4
        id: toolchain
        with:
          path: |
            ndless/ndless-sdk/toolchain/install
            ndless/ndless-sdk/toolchain/.built_binutils
            ndless/ndless-sdk/toolchain/.built_gcc_step1
